about:
  p1: >-
    I'm an economist driven by a simple question: how do weather and climate shape the systems
    we depend on — our energy grids, our food supply, our policy choices? My research sits at the
    intersection of climate, energy, and agriculture, where I use econometrics and machine learning
    to turn high-resolution weather data into actionable forecasts and credible causal estimates.
  p2: >-
    My path has been anything but linear. I started in commodity trading and risk analysis at Shell
    and Glencore in the Netherlands, where I learned to think in real time about markets, data, and
    uncertainty. That experience pulled me toward deeper questions — which led me to a PhD at the
    University of Hawaii, where I studied how temperature drives electricity demand and how
    satellite weather data can predict crop yields around the world. My dissertation won the
    TK Jayaraman & Family Prize for Best PhD Dissertation.
  p3: >-
    Today I split my time between public policy and entrepreneurship. As a Senior Economist at the
    Hawaii Department of Taxation, I evaluate the fiscal impact of clean energy tax credits —
    work that directly shapes legislation. On the research side, I co-founded AE4cast to bring
    grid-level crop yield forecasting to agricultural markets. I also teach econometrics,
    environmental economics, and statistics at UH Manoa, where I get to share my enthusiasm for
    data-driven thinking with the next generation of economists.
  p4: >-
    Born in China, trained in the Netherlands and the US, and now based in Honolulu — I've built my career
    across cultures and continents, and I bring that global perspective to everything I do.

publications:
  - status: published
    title: '"Using Temperature Sensitivity to Estimate Shiftable Electricity Demand"'
    authors: "Roberts, M. J., Zhang, S., Yuan, E., Jones, J., and Fripp, M."
    venue: "<em>iScience</em>, 25(9), 104940, 2022"
    description: >-
      Pairs fine-scale weather data with hourly electricity consumption across 31 US regions;
      uses conditionally exogenous weather variation as a natural experiment to estimate
      temperature-sensitive demand and simulate load-shifting implications for power system
      investment under climate change.
  - status: working
    title: '"Using Weather-Based Crop Yield Forecasts to Estimate Commodity Demand"'
    authors: "Roberts, M. J., and Zhang, S."
    venue: "Working paper, 2024"
    description: >-
      Links daily crop yield forecasts to futures prices to estimate corn demand, with preliminary
      results suggesting more inelastic demand than previous studies. Constructs forecasting models
      and data pipelines connecting weather-based yield predictions to commodity market outcomes.
  - status: working
    title: '"Process-Based versus Statistical Crop Models: Divergent Climate Change Projections for U.S. Corn and Soybean Yields"'
    authors: "Zhang, S."
    venue: "Working paper, 2026"
    description: >-
      Compares the widely used SIMPLE process-based crop model with flexible statistical models
      under climate change scenarios. Finds that statistical models fit better and the two approaches
      produce divergent warming projections, in part because the process-based model does not fully
      capture extreme heat effects — implying that policymakers relying on process-based models
      alone may underestimate climate damages to agriculture.
  - status: working
    title: '"Comparison of Reanalysis Weather Data for Hourly Electricity Demand Forecast"'
    authors: "Zhang, S."
    venue: "Working paper, 2026"
    description: >-
      Compares NARR, MERRA2, and ERA5-Land reanalysis weather datasets for electricity demand
      forecasting — a methodological choice that significantly affects downstream model accuracy.
      Provides guidance on dataset selection for applied energy and climate research.


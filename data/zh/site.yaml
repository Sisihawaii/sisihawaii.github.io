about:
  p1: >-
    我研究天气和气候如何影响我们赖以生存的系统——电力网络、粮食供应链以及相关政策。我的研究运用计量经济学和
    机器学习，将高分辨率气象数据转化为可操作的预测和可信的因果估计。我的研究视角独特之处在于，研究问题源自
    产业和政策实践：在嘉能可从事大宗商品交易和在壳牌从事能源风险分析的多年经历，让我看到了市场亟需更好的
    解决方案；而我目前作为夏威夷州税务局高级经济学家的工作——涵盖能源、住房和农业税收政策的收入影响估算——
    持续激发出值得更深入、更系统研究的问题。我联合创办了AE4cast，将农作物产量预测研究引入农业市场；
    在夏威夷大学马诺阿分校，我教授计量经济学和环境经济学，引导学生将经济理论应用于实际问题。
    工作之余，我通常在徒步登山、浮潜探礁，或者在某个新城市寻觅地道的街头美食。

publications:
  - status: published
    title: '"Using Temperature Sensitivity to Estimate Shiftable Electricity Demand"'
    authors: "Roberts, M. J., Zhang, S., Yuan, E., Jones, J., and Fripp, M."
    venue: "<em>iScience</em>, 25(9), 104940, 2022"
    description: >-
      将精细尺度气象数据与美国31个地区的逐时电力消费数据相结合，利用条件外生的气象变异作为自然实验，
      估算温度敏感型电力需求，并模拟负荷转移对气候变化下电力系统投资的影响。
  - status: working
    title: '"Using Weather-Based Crop Yield Forecasts to Estimate Commodity Demand"'
    authors: "Roberts, M. J., and Zhang, S."
    venue: "工作论文, 2024"
    description: >-
      将每日农作物产量预测与期货价格相关联以估算玉米需求，初步结果表明需求弹性低于以往研究。
      构建预测模型和数据管道，将基于气象的产量预测与大宗商品市场结果相连接。
  - status: working
    title: '"Process-Based versus Statistical Crop Models: Divergent Climate Change Projections for U.S. Corn and Soybean Yields"'
    authors: "Zhang, S."
    venue: "工作论文, 2026"
    description: >-
      比较广泛使用的SIMPLE过程模型与灵活的统计模型在气候变化情景下的预测。研究发现统计模型拟合更优，
      两种方法在变暖预测上产生分歧，部分原因是过程模型未能充分捕捉极端高温效应——这意味着仅依赖过程模型的
      政策制定者可能低估气候变化对农业的损害。
  - status: working
    title: '"Comparison of Reanalysis Weather Data for Hourly Electricity Demand Forecast"'
    authors: "Zhang, S."
    venue: "工作论文, 2026"
    description: >-
      比较NARR、MERRA2和ERA5-Land再分析气象数据集用于电力需求预测的表现——这一方法选择对下游模型
      准确性有显著影响。为应用能源和气候研究中的数据集选择提供指导。

